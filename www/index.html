<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b0f14">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Frontlinie</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">
  <div id="top">
    <div class="stat" id="credits" title="Credits">₵ 0</div>
    <div class="stat" id="cheatTag" style="display:none" title="Cheat: unbegrenzt Geld">CHEAT</div>
    <div class="stat" title="Energie">⚡ <span id="pwrtxt">0/0</span> <div id="pwrbar"><div id="pwrfill"></div></div></div>
    <div class="stat" id="peace" style="display:none" title="Friedenszeit">Frieden 5:00</div>
    <div class="stat" id="clock">00:00</div>
    <button id="btnMute" aria-label="Ton ausschalten"></button>
    <button id="btnPause" aria-label="Pause"></button>
    <button id="btnMenu" aria-label="Menü"></button>
  </div>
  <div id="map">
    <canvas id="cv"></canvas>
    <canvas id="ov"></canvas>
    <canvas id="mini"></canvas>
    <button id="btnRepair"></button><!-- v0.9.2 Reparatur -->
    <div id="selinfo"></div>
    <div id="hint"></div>
    <div id="swstack"></div>
    <div id="swalert" role="alert"></div>
    <div id="toasts"></div>
    <div id="pausedTag">Pause</div>
    <div id="repbar" style="display:none"><div class="msg">Gebäude antippen zum Reparieren</div><div class="btns"><button data-act="repairall"><span class="lb">Alle beschädigten reparieren</span></button><button data-act="repairend"><span class="lb">Fertig</span></button></div></div><!-- v0.9.2 Reparatur -->
    <div id="cmdbar"></div>
    <div id="placebar"><div class="msg" id="placeMsg"></div><div class="btns"><button class="yes" id="placeOk"></button><button class="no" id="placeNo" aria-label="Abbrechen"></button></div></div>
  </div>
  <div id="side">
    <div id="tabs"></div>
    <div id="qinfo"></div>
    <div id="tiles"></div>
    <div id="hotkeys"></div>
  </div>
</div>

<div class="screen" id="startScreen"></div>
<div class="screen" id="pauseScreen"></div>
<div class="screen" id="endScreen"></div>
<div class="screen" id="helpScreen"></div>

<script src="vendor/three.js"></script>
<script src="src/data.js"></script>
<script src="src/maps.js"></script>
<script src="src/sim.js"></script>
<script src="src/path.js"></script>
<script src="src/cmd.js"></script>
<script src="src/ai.js"></script>
<script src="src/render3d.js"></script>
<script src="src/r3-models.js"></script>
<script src="src/r3-terrain.js"></script>
<script src="src/r3-fx.js"></script>
<script src="src/r3-shadow.js"></script>
<script src="src/r3-mood.js"></script>
<script src="src/sprites-data.js"></script>
<script src="src/render2d.js"></script>
<script src="src/r3-gfxtest.js"></script>
<script src="src/audio.js"></script>
<script src="src/input.js"></script>
<script src="src/ui.js"></script>
<script src="src/save.js"></script>
<script src="src/main.js"></script>
<script src="src/native.js"></script>
</body>
</html>
